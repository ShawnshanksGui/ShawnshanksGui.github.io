name: Update conference deadlines

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conference-deadline-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Refresh official conference data
        run: python scripts/update_conferences.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- _data/conference_deadlines.json; then
            echo "Conference data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/conference_deadlines.json
          git commit -m "data: refresh conference deadlines"
          git push
